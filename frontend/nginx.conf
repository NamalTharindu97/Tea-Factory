server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /employees {
        proxy_pass http://backend:5000/api/v1/tea-factory/employees;
    }

    location /inventory {
        proxy_pass http://backend:5000/api/v1/tea-factory/inventory;
    }

    location /payrolls {
        proxy_pass http://backend:5000/api/v1/tea-factory/payrolls;
    }

    location /productions {
        proxy_pass http://backend:5000/api/v1/tea-factory/productions;
    }

    location /supliers {
        proxy_pass http://backend:5000/api/v1/tea-factory/supliers;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
